<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straight Dominoes (All Fives)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="score-box us">
                <div class="team-name">US</div>
                <div class="score-text"><span id="player-score">0</span> / 150</div>
            </div>
            <div class="score-x">X</div>
            <div class="score-box rivals">
                <div class="team-name">RIVALS</div>
                <div class="score-text"><span id="ai-score">0</span> / 150</div>
            </div>
        </div>

        <div id="series-tracker">Series: Player 0 - 0 AI</div>
        <div id="message-area">Starting Game...</div>

        <div id="ai-hand" class="hand"></div>

        <div id="table-ring">
            <div id="board-area">
                <div id="board">
                    <!-- Dominoes will be placed here -->
                </div>
            </div>
        </div>

        <div id="player-hand" class="hand"></div>

        <div id="controls">
            <button id="start-btn">Start Game</button>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="hard">Hard</option>
            </select>
            <div id="boneyard-info">Boneyard: <span id="boneyard-count">0</span></div>
        </div>
    </div>

    <!-- Score Popup Template -->
    <div id="score-popup" class="hidden">+0</div>

    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
