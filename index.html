<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straight Dominoes (All Fives)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div id="series-tracker">Series: Player 0 - 0 AI</div>
            <div id="game-info">
                <!-- Scores will be injected here or use fixed slots -->
                <span id="score-0" class="score-display">P1: 0</span>
                <span id="score-1" class="score-display">P2: 0</span>
                <span id="score-2" class="score-display hidden">P3: 0</span>
                <span id="score-3" class="score-display hidden">P4: 0</span>
                <span id="target-score">Target: 150</span>
            </div>
            <div id="message-area">Starting Game...</div>
        </div>

        <div id="top-hand" class="hand"></div>

        <div id="middle-row">
            <div id="left-hand" class="hand vertical hidden"></div>

            <div id="board-area">
                <div id="board">
                    <!-- Dominoes will be placed here -->
                </div>
            </div>

            <div id="right-hand" class="hand vertical hidden"></div>
        </div>

        <div id="bottom-hand" class="hand"></div>

        <div id="controls">
            <button id="start-btn">Start Game</button>
            <select id="player-count">
                <option value="2">2 Players</option>
                <option value="4">4 Players</option>
            </select>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="hard">Hard</option>
            </select>
            <div id="boneyard-info">Boneyard: <span id="boneyard-count">0</span></div>
        </div>
    </div>

    <!-- Score Popup Template -->
    <div id="score-popup" class="hidden">+0</div>

    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
