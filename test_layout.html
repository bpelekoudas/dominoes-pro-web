<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="top-section" class="player-section">
            <div id="score-top" class="score-display">Top: 0</div>
            <div id="top-hand" class="hand">
                <div class="domino"></div><div class="domino"></div>
            </div>
        </div>

        <div id="middle-row">
            <div id="left-section" class="player-section side-section">
                <div id="score-left" class="score-display">Left: 0</div>
                <div id="left-hand" class="hand vertical">
                    <div class="domino"></div><div class="domino"></div>
                </div>
            </div>

            <div id="board-area">
                <div id="board">Board Area</div>
            </div>

            <div id="right-section" class="player-section side-section">
                <div id="score-right" class="score-display">Right: 0</div>
                <div id="right-hand" class="hand vertical">
                    <div class="domino"></div><div class="domino"></div>
                </div>
            </div>
        </div>

        <div id="bottom-section" class="player-section">
            <div id="score-bottom" class="score-display">Player: 0</div>
            <div id="bottom-hand" class="hand">
                <div class="domino"></div><div class="domino"></div>
            </div>
        </div>
    </div>
</body>
</html>
